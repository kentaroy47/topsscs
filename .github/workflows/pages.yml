name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refetch:
        description: "Re-fetch papers from Crossref"
        type: boolean
        default: true
  schedule:
    - cron: "0 18 * * 0"  # weekly, Monday 03:00 JST

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from Crossref
        if: github.event_name == 'schedule' || inputs.refetch
        run: python scripts/fetch_crossref.py && python scripts/fill_openalex.py
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || inputs.refetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data from Crossref" && git push
      - name: Build site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
